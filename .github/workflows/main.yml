name: CI-CD

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  test-trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Install Trivy
      #   run: |
      #     curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.43.0/trivy_0.43.0_Linux-x86_64.tar.gz -o trivy.tar.gz
      #     tar zxvf trivy.tar.gz
      #     sudo mv trivy /usr/local/bin/


      - name: Run Trivy vulnerability scanner and create GitHub issues
        uses: knqyf263/trivy-issue-action@v0.0.6
        with:
          assignee: debarbozar
          severity: 'CRITICAL,HIGH,LOW'
          label: security
          filename: result.json
        env:
          GH_TOKEN: ${{ secrets.TRIVY_TOKEN }}

  # test-sonarquobe:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4










  ci-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar checkout do projeto
        uses: actions/checkout@v4

      - name: Autenticar Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Docker hub
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          file: src/Dockerfile
          tags: |
            debarbozar/fake-shop:latest
            debarbozar/fake-shop:v${{github.run_number}}


  cd-eks:
    runs-on: ubuntu-latest
    needs: [ci-docker]
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Realizar checkout do projeto
        uses: actions/checkout@v4

      - name: Autenticação na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configurar o kubectl
        run: aws eks update-kubeconfig --name eks-devopspro --region us-east-1

      - name: Deploy dos manifestos no Kubernetes
        uses: Azure/k8s-deploy@v5
        with:
          manifests: |
            ./k8s/deployment.yaml
          images: |
            debarbozar/fake-shop:v${{ github.run_number }}
